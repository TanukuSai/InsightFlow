services:
  - type: web
    name: insightflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: PUBLIC_DEMO_WORKSPACE_ID
        value: ws-production-eval
      - key: CANONICAL_DATASET_ID
        value: ds-796d15b9a096
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./insightflow.db
      - key: CORS_ALLOWED_ORIGINS
        value: '["http://localhost:3000","https://frontend-bay-ten-95.vercel.app"]'
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: MAX_CSV_ROWS
        value: "20000"
      - key: ENABLE_PUBLIC_ADAPTION_OPERATIONS
        value: "true"
      - key: ADAPTION_API_KEY
        sync: false
      - key: ADAPTION_MAX_ROWS
        value: "1000"
      - key: ADAPTION_DAILY_ESTIMATE_LIMIT
        value: "10"
      - key: ADAPTION_DAILY_RUN_LIMIT
        value: "3"
      - key: JWT_SECRET_KEY
        value: "insightflow-production-jwt-secret-key-entropy-64-bytes-2026-build-battle"
      - key: INSIGHTFLOW_BFF_SHARED_SECRET
        value: "insightflow-production-bff-secret-secure-32-chars-key-2026"
      - key: SEED_DEMO_DATA_ON_STARTUP
        value: "true"

